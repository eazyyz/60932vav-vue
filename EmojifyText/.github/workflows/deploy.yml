name: Deploy frontend

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EmojifyText/package-lock.json

      - run: npm ci
        working-directory: EmojifyText

      - run: npm run build
        working-directory: EmojifyText
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload dist
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -s EmojifyText/dist/index.html

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            EmojifyText/dist/ \
            "$SSH_USER@$SSH_HOST:/var/www/labs/60932vav-vue/EmojifyText/dist/"